# ===========================================================================
# redis.conf — tuned for "Redis Streams is my durable write queue"
# ===========================================================================
# This is not generic Redis config — it specifically assumes XADD'd cost
# events sitting unflushed to Postgres are the most valuable thing in this
# instance, and optimizes for not losing them across a crash or restart.

# ── Persistence: AOF (append-only file) ───────────────────────────────────
# AOF is required for stream durability across a crash/restart. RDB
# snapshots alone are not enough — a snapshot only captures point-in-time
# state, so anything XADD'd between snapshots is lost on crash even with
# RDB enabled.
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# fsync policy: this is the actual loss-window knob.
#   always   -> fsync every write. Effectively zero loss window, but every
#               XADD pays a disk fsync — meaningfully slower under load.
#   everysec -> fsync once per second (Redis default). Up to ~1s of acked
#               writes can vanish if the OS/box dies (not just the Redis
#               process — `redis-server` crashing alone does NOT lose data
#               with everysec, since the kernel still has the buffered
#               writes; only an OS-level crash or power loss does).
#   no       -> let the OS decide. Don't use this here.
#
# everysec is the right default for a cost-metering pipeline: a ~1s loss
# window on raw OS/power failure is an acceptable trade for not taking an
# fsync hit on every single ingested event. Switch to "always" only if a
# 1-second loss window on hard power loss is unacceptable for billing
# accuracy in your business — it roughly halves single-instance write
# throughput.
appendfsync everysec

# Don't let a slow/blocked AOF rewrite child process block client writes —
# matters under sustained high ingest rates.
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes

# ── Crash recovery behavior ────────────────────────────────────────────────
# If the AOF file is truncated/corrupted by an unclean shutdown (e.g. disk
# full mid-write, OS killed -9), start anyway after auto-trimming the
# trailing corrupt entry, rather than refusing to boot. The alternative
# (no) means redis-server simply won't start until you manually run
# redis-check-aof --fix, which for this architecture means /ingest and
# check-tenant-limit are both down until someone intervenes by hand — too
# fragile for a component everything else depends on.
aof-load-truncated yes

# ── RDB snapshots: kept as a secondary safety net, not primary durability ─
# Useful for fast full-instance restores and as a second recovery path if
# the AOF dir itself is ever lost, but the data-loss guarantee above comes
# from AOF, not this.
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# ── Memory ceiling + eviction policy ───────────────────────────────────────
# Must match (or stay under) the Docker memory limit set in
# docker-compose.yml's `deploy.resources.limits.memory` for the redis
# service, so Redis self-limits before the OS OOM-killer has to step in.
maxmemory 900mb

# noeviction: refuse new writes (return OOM error) once the memory ceiling
# is hit, rather than silently evicting existing keys. This is the only
# safe policy here — any eviction policy (allkeys-lru, volatile-ttl, etc.)
# is built for cache semantics, where losing a key just means a slower
# recompute. Here, evicting a key could mean dropping unacked stream
# entries or tenant cost-cache state, which is real data loss disguised
# as a cache miss. An OOM error on XADD is loud and recoverable (scale
# Redis memory up, or work down the backlog); silent eviction is not.
maxmemory-policy noeviction

# ── Networking / misc hardening ─────────────────────────────────────────
# Keep clients from hanging forever against a wedged connection.
timeout 0
tcp-keepalive 300

# Bind to all interfaces inside the Docker network only — no exposed ports
# on this service in docker-compose.yml, so this is defense in depth.
protected-mode yes